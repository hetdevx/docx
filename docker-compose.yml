x-internal-env: &internal-env
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      <<: *internal-env
    depends_on:
      minio:
        condition: service_started

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-docvault}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-docvault123}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
